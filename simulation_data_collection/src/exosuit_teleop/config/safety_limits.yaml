# Set in a deployment-specific file after validation, leaving the shipped profile inert.
safety:
  # Identifier of the reviewed Isaac model, scene (including table), and calibration.
  approved_scene: ""
  # Verified controller stop on loss of this stream, and stop settling time in seconds.
  verified_watchdog: false
  stop_settle_s: ""
  # The live bridge/controller must preserve the wire contract and honor recording OFF.
  verified_bridge: false
  # MoveIt move_group GetStateValidity, backed by the approved full static planning scene.
  validity_service: ""
  collision_sample_deg: ""
  plan_timeout_s: ""
  feedback_age_s: ""
  tracking_deg: ""
  arrival_deg: ""
  stopped_deg_s: ""
  # Deployment measurements and limits for each named joint. Units are degrees.
  # Keys: velocity_deg_s, acceleration_deg_s2. URDF bounds are always enforced.
  joints: {}
  # Maximum plausible encoder shaft speed and valid interval between tick sets.
  encoder_max_deg_s: ""
  encoder_age_s: ""
  # Receipt timestamps alone cannot detect stale/replayed bridge data.
  feedback_type: dynamic_biped/robotQVTau
  verified_unstamped_feedback: false  # robotQVTau has no header; see README
  feedback_units: ""  # degrees or radians, for both position and velocity
  feedback_order: []   # exactly 14 names for robotQVTau, ignored for JointState
